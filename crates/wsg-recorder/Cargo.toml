[package]
name = "wsg-recorder"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
wsg-core = { path = "../wsg-core" }
thiserror = "2.0.21"
serde_json = "1.0.154"
# Used only by the wsg-gpu-helper bin; the library never calls NVML.
nvml-wrapper = "0.13.0"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Performance",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_SystemInformation",
  "Win32_System_JobObjects",
  "Win32_Security",
] }
