[package]
name = "wsg-cli"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "wsg"
path = "src/main.rs"

[dependencies]
wsg-core = { path = "../wsg-core" }
wsg-events = { path = "../wsg-events" }
wsg-analysis = { path = "../wsg-analysis" }
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
