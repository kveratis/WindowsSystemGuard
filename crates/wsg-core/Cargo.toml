[package]
name = "wsg-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
crc32fast = "1.5.5"
getrandom = "0.4.3"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
windows-sys = { version = "0.61.2", features = ["Win32_System_Performance", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3.27.0"
